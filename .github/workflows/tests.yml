name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The two services that make up the product. Both must pass.
        service: [campaign-portal, postverify-api]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements-dev.txt

      - name: Install
        working-directory: ${{ matrix.service }}
        run: pip install -r requirements-dev.txt

      - name: Lint
        working-directory: ${{ matrix.service }}
        run: ruff check app tests

      # No test touches a browser or the network, so CI needs neither Chrome
      # nor outbound access. If that ever stops being true, the suite has
      # acquired a dependency it should not have.
      - name: Test
        working-directory: ${{ matrix.service }}
        run: pytest -q
