<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ImageMatch</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --line:#e3e6ea; --line-soft:#eef0f3;
    --ink:#12161c; --muted:#68727f; --faint:#98a2ae;
    --accent:#0084cc; --accent-soft:#e6f4fb;
    --ok:#12855b; --ok-soft:#e4f5ee; --warn:#a8620a; --warn-soft:#fdf1e2;
    --bad:#c02a2a; --bad-soft:#fdecec;
    --radius:12px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0d1014; --panel:#141922; --line:#242c38; --line-soft:#1c2330;
      --ink:#e8ecf1; --muted:#93a0b0; --faint:#65717f;
      --accent:#3aaee6; --accent-soft:#11293a;
      --ok:#4bd39b; --ok-soft:#0f2a20; --warn:#e8a55c; --warn-soft:#2b1f10;
      --bad:#f08a8a; --bad-soft:#2c1414;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:40px 20px 80px}
  header{margin-bottom:32px}
  h1{margin:0;font-size:26px;letter-spacing:-.02em}
  .sub{color:var(--muted);margin-top:6px;font-size:14px}

  .step{margin-bottom:22px}
  .step-label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--faint);font-weight:600;margin-bottom:10px;display:flex;gap:8px;align-items:center}
  .step-label b{background:var(--line-soft);color:var(--muted);width:18px;height:18px;
    border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
  .pf{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 14px;text-align:left;cursor:pointer;font:inherit;color:inherit;
    display:flex;align-items:center;gap:9px;transition:border-color .12s,background .12s}
  .pf:hover{border-color:var(--accent)}
  .pf[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
  .dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--ok)}
  .dot.warn{background:var(--warn)}
  .pf-name{font-weight:600;font-size:14px}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  .how{font-size:13.5px;color:var(--muted);margin:0}
  input[type=url]{width:100%;padding:11px 13px;border:1px solid var(--line);
    border-radius:10px;background:var(--panel);color:var(--ink);font:inherit}
  input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}

  .drop{border:1.5px dashed var(--line);border-radius:var(--radius);padding:26px 16px;
    text-align:center;cursor:pointer;background:var(--panel);transition:border-color .12s,background .12s}
  .drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
  .drop p{margin:0;font-size:13.5px;color:var(--muted)}
  .drop strong{color:var(--accent)}
  .preview{display:flex;gap:14px;align-items:center}
  .preview img{width:88px;height:88px;object-fit:cover;border-radius:10px;
    border:1px solid var(--line);flex:none}
  .preview .meta{font-size:13px;color:var(--muted);min-width:0}
  .preview .meta b{display:block;color:var(--ink);font-size:14px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  button.go{padding:12px 22px;border:0;border-radius:10px;background:var(--accent);
    color:#fff;font:inherit;font-weight:600;cursor:pointer;width:100%;margin-top:18px}
  button.go:disabled{opacity:.5;cursor:default}
  .link{background:none;border:0;color:var(--accent);font:inherit;font-size:13px;
    cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px;text-align:left}
  .hint{font-size:12.5px;color:var(--faint);margin-top:9px;word-break:break-all}

  .out{margin-top:24px}
  .verdict{font-size:28px;font-weight:650;letter-spacing:-.02em;line-height:1.2}
  .verdict.yes{color:var(--ok)} .verdict.no{color:var(--bad)} .verdict.maybe{color:var(--warn)}
  .verdict small{display:block;font-size:14px;font-weight:500;color:var(--muted);
    margin-top:8px;letter-spacing:0}
  .pair{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap}
  .pair figure{margin:0;flex:1 1 150px}
  .pair img{width:100%;border-radius:10px;border:1px solid var(--line);display:block}
  .pair figcaption{font-size:12px;color:var(--faint);margin-top:6px}
  dl{display:grid;grid-template-columns:auto 1fr;gap:7px 18px;margin:18px 0 0;
    padding-top:14px;border-top:1px solid var(--line-soft);font-size:13px}
  dt{color:var(--faint)} dd{margin:0;word-break:break-all}
  .err{border-color:var(--bad);background:var(--bad-soft)}
  .err h3{margin:0 0 6px;font-size:14px;color:var(--bad)}
  .err p{margin:0;font-size:13.5px}
  footer{margin-top:40px;font-size:12.5px;color:var(--faint);text-align:center}
  footer a{color:var(--faint)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ImageMatch</h1>
    <div class="sub">Ek image do aur post ka URL &mdash; batayenge wo image us post me hai ya nahi.</div>
  </header>

  <section class="step">
    <div class="step-label"><b>1</b> Platform chuno</div>
    <div class="grid" id="picker"><p class="how" style="grid-column:1/-1">Loading&hellip;</p></div>
  </section>

  <section class="step" id="rest" hidden>
    <div class="step-label"><b>2</b> Post ka URL</div>
    <div class="card">
      <p class="how" id="how"></p>
      <div style="margin-top:12px"><input type="url" id="url" placeholder="https://" autocomplete="off" spellcheck="false"></div>
      <div class="hint">Sample: <button class="link" id="sample"></button></div>
    </div>

    <div class="step-label" style="margin-top:22px"><b>3</b> Image chuno</div>
    <div class="drop" id="drop">
      <p><strong>Click karo</strong> ya image yahan drag karo &mdash; JPG, PNG, WebP</p>
    </div>
    <input type="file" id="file" accept="image/*" hidden>

    <button class="go" id="go" disabled>Milao</button>
  </section>

  <section class="out" id="out"></section>
  <footer><a href="/docs">API docs</a></footer>
</div>

<script>
const $ = s => document.querySelector(s);
const ESCAPES = {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"};
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ESCAPES[c]);

let platforms = [], current = null, picked = null, previewURL = null;

async function boot() {
  try {
    const r = await fetch("/platforms");
    platforms = (await r.json()).platforms || [];
  } catch (e) {
    $("#picker").innerHTML = "<p class=\"how\" style=\"grid-column:1/-1\">Service se connect nahi ho paya.</p>";
    return;
  }
  $("#picker").innerHTML = platforms.map(p => `
    <button class="pf" data-id="${esc(p.id)}" aria-pressed="false"
            title="${p.ready ? "Ready" : "Browser chahiye"}">
      <span class="dot ${p.ready ? "" : "warn"}"></span>
      <span class="pf-name">${esc(p.label)}</span>
    </button>`).join("");
  $("#picker").addEventListener("click", e => {
    const b = e.target.closest(".pf");
    if (b) select(b.dataset.id);
  });
  const wanted = (location.hash || "").slice(1);
  if (wanted && platforms.some(p => p.id === wanted)) select(wanted);
}

function select(id) {
  current = platforms.find(p => p.id === id);
  if (!current) return;
  document.querySelectorAll(".pf").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.id === id)));
  $("#rest").hidden = false;
  $("#how").textContent = current.how;
  $("#sample").textContent = current.sample_url;
  $("#url").placeholder = current.sample_url;
  $("#out").innerHTML = "";
  history.replaceState(null, "", "#" + id);
  refresh();
}

$("#sample").onclick = () => { $("#url").value = current.sample_url; refresh(); };
$("#url").addEventListener("input", refresh);

const drop = $("#drop"), fileInput = $("#file");
drop.onclick = () => fileInput.click();
drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", e => {
  e.preventDefault();
  drop.classList.remove("over");
  if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener("change", () => {
  if (fileInput.files[0]) setFile(fileInput.files[0]);
});

function setFile(f) {
  picked = f;
  if (previewURL) URL.revokeObjectURL(previewURL);
  previewURL = URL.createObjectURL(f);
  drop.innerHTML = `<div class="preview">
      <img src="${previewURL}" alt="">
      <div class="meta"><b>${esc(f.name)}</b>${Math.round(f.size / 1024)} KB &middot; badalne ke liye click karo</div>
    </div>`;
  refresh();
}

function refresh() {
  $("#go").disabled = !(current && $("#url").value.trim() && picked);
}

$("#go").onclick = async () => {
  const go = $("#go");
  go.disabled = true;
  const slow = current.needs_browser;
  $("#out").innerHTML = `<div class="card"><p class="how">${
    slow ? "Post ki images nikaali ja rahi hain — 8-15 second lagenge…"
         : "Compare ho raha hai…"}</p></div>`;
  const body = new FormData();
  body.append("url", $("#url").value.trim());
  body.append("image", picked);
  try {
    const r = await fetch("/" + current.id + "/match", {method: "POST", body});
    const d = await r.json();
    if (r.ok) showResult(d);
    else showError(d.detail || {message: "Kuch galat ho gaya."});
  } catch (e) {
    showError({message: "Service tak request nahi pahunchi."});
  } finally {
    go.disabled = false;
  }
};

const HEAD = {
  identical: ["Haan — bilkul wahi image", "yes"],
  same: ["Haan — ye image is post me hai", "yes"],
  likely: ["Shayad — pakka nahi", "maybe"],
  different: ["Nahi — ye image is post me nahi mili", "no"]
};

function showResult(d) {
  const [title, cls] = HEAD[d.verdict] || ["Result", ""];
  const m = d.matched;
  $("#out").innerHTML = `
    <div class="card">
      <div class="verdict ${cls}">${esc(title)}
        <small>${esc(d.summary)}</small>
      </div>
      ${m ? `<div class="pair">
        <figure><img src="${previewURL}" alt=""><figcaption>Aapki image</figcaption></figure>
        <figure><img src="${esc(m.url)}" alt=""><figcaption>${esc(m.label || "Post ki image")}</figcaption></figure>
      </div>` : ""}
      <dl>
        <dt>Platform</dt><dd>${esc(d.platform_label)}</dd>
        <dt>Post</dt><dd><a href="${esc(d.canonical_url)}" target="_blank" rel="noopener noreferrer">${esc(d.canonical_url)}</a></dd>
        <dt>Images check ki</dt><dd>${d.images_checked}</dd>
        ${m ? `<dt>Kitna pakka</dt><dd>${Math.round(m.confidence * 100)}%</dd>
        <dt>Kahan mili</dt><dd>${m.tier === "post" ? "Post ki apni image" : "Post page pe (carousel ya related post ho sakti hai)"}</dd>` : ""}
      </dl>
    </div>`;
}

function showError(d) {
  const wrong = d.error === "wrong_platform";
  const other = wrong ? platforms.find(p => p.id === d.actual) : null;
  $("#out").innerHTML = `
    <div class="card err">
      <h3>${wrong ? "Platform match nahi kiya" : "Compare nahi ho paya"}</h3>
      <p>${esc(d.message || "")}</p>
      ${other ? `<div style="margin-top:12px"><button class="link" id="switch">${esc(other.label)} pe switch karo</button></div>` : ""}
    </div>`;
  if (other) $("#switch").onclick = () => select(other.id);
}

boot();
</script>
</body>
</html>
