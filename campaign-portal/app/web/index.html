<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campaign Portal</title>
<style>
  :root{
    --bg:#f4f6f8; --panel:#fff; --panel-2:#f8fafb;
    --line:#dfe4e9; --line-soft:#eceff2;
    --ink:#11161c; --muted:#5d6874; --faint:#8d98a5;
    --accent:#0084cc; --accent-soft:#e4f2fa; --accent-line:#b6dcf0;
    --ok:#0f7a52; --ok-soft:#e2f3ec; --ok-line:#b7e2ce;
    --warn:#9a5a08; --warn-soft:#fbf0e0; --warn-line:#efd6ab;
    --bad:#b52a2a; --bad-soft:#fbeaea; --bad-line:#f0c4c4;
    --radius:10px;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0c1015; --panel:#131a22; --panel-2:#171f28;
      --line:#26313d; --line-soft:#1c242e;
      --ink:#e6ecf2; --muted:#94a2b1; --faint:#6a7784;
      --accent:#3aaee6; --accent-soft:#102636; --accent-line:#1d4256;
      --ok:#4cd39c; --ok-soft:#0e2a20; --ok-line:#1d4a38;
      --warn:#e4a35d; --warn-soft:#2a1e11; --warn-line:#4a3719;
      --bad:#ef8b8b; --bad-soft:#2b1414; --bad-line:#4d2424;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0c1015; --panel:#131a22; --panel-2:#171f28;
    --line:#26313d; --line-soft:#1c242e;
    --ink:#e6ecf2; --muted:#94a2b1; --faint:#6a7784;
    --accent:#3aaee6; --accent-soft:#102636; --accent-line:#1d4256;
    --ok:#4cd39c; --ok-soft:#0e2a20; --ok-line:#1d4a38;
    --warn:#e4a35d; --warn-soft:#2a1e11; --warn-line:#4a3719;
    --bad:#ef8b8b; --bad-soft:#2b1414; --bad-line:#4d2424;
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  code,.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;
    transition-duration:.001ms!important}}

  /* ---------- topbar ---------- */
  .top{position:sticky;top:0;z-index:20;background:var(--panel);
    border-bottom:1px solid var(--line)}
  .top-in{max-width:1180px;margin:0 auto;padding:12px 20px;
    display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .brand{font-weight:650;font-size:16px;letter-spacing:-.015em;
    display:flex;align-items:center;gap:9px}
  .brand i{width:9px;height:9px;border-radius:50%;background:var(--accent);
    display:inline-block;flex:none}
  .who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px}
  .who label{color:var(--faint);font-size:11px;letter-spacing:.09em;
    text-transform:uppercase;font-weight:600}
  .who input{width:132px;padding:6px 10px;border:1px solid var(--line);
    border-radius:7px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px}

  /* ---------- shell ---------- */
  .shell{max-width:1180px;margin:0 auto;padding:22px 20px 80px;
    display:grid;grid-template-columns:190px minmax(0,1fr);gap:26px}
  @media (max-width:860px){.shell{grid-template-columns:minmax(0,1fr)}}
  .rail{align-self:start;position:sticky;top:66px}
  @media (max-width:860px){.rail{position:static}}
  .rail h3{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--faint);font-weight:600;margin:0 0 8px}
  .rail h3+nav{margin-bottom:20px}
  .rail nav{display:flex;flex-direction:column;gap:2px}
  .rail a{color:var(--muted);text-decoration:none;font-size:14px;padding:7px 11px;
    border-radius:7px;cursor:pointer;border:1px solid transparent}
  .rail a:hover{background:var(--panel);color:var(--ink)}
  .rail a.on{background:var(--accent-soft);color:var(--accent);
    border-color:var(--accent-line);font-weight:500}
  .rail a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

  /* ---------- generic ---------- */
  h1{font-size:21px;letter-spacing:-.02em;margin:0 0 4px;text-wrap:balance}
  .sub{color:var(--muted);font-size:13.5px;margin:0 0 20px;max-width:70ch}
  .card{background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius);padding:18px}
  .card+.card{margin-top:14px}
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
  .g3{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .spread{display:flex;justify-content:space-between;align-items:center;gap:12px;
    flex-wrap:wrap}
  .muted{color:var(--muted)} .faint{color:var(--faint)}
  .small{font-size:12.5px}
  hr{border:0;border-top:1px solid var(--line-soft);margin:16px 0}

  label.f{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--faint);font-weight:600;margin:0 0 6px}
  input[type=text],input[type=url],input[type=number],select,textarea{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;
    background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
  textarea{min-height:70px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);
    outline-offset:-1px;border-color:transparent}
  .field+.field{margin-top:13px}

  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid transparent;
    padding:9px 15px;font-size:14px;font-weight:500}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .btn{background:var(--accent);color:#fff}
  .btn:disabled{opacity:.5;cursor:default}
  .btn-2{background:var(--panel);color:var(--ink);border-color:var(--line)}
  .btn-2:hover{border-color:var(--accent);color:var(--accent)}
  .btn-sm{padding:5px 11px;font-size:12.5px}
  .btn-ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}
  .btn-bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-line)}
  .link{background:none;border:0;color:var(--accent);padding:0;font-size:13px;
    text-decoration:underline;text-underline-offset:2px}

  /* ---------- status pills ---------- */
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;
    font-weight:600;padding:3px 9px;border-radius:99px;border:1px solid transparent;
    white-space:nowrap}
  .pill i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
  .p-approved{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}
  .p-rejected{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-line)}
  .p-pending,.p-verifying{background:var(--warn-soft);color:var(--warn);
    border-color:var(--warn-line)}
  .p-error{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-line)}
  .p-active{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}
  .p-draft{background:var(--line-soft);color:var(--faint)}
  .p-closed{background:var(--line-soft);color:var(--faint)}
  .p-completed{background:var(--accent-soft);color:var(--accent);
    border-color:var(--accent-line)}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
  .p-pending i,.p-verifying i{animation:blink 1.1s ease-in-out infinite}

  /* ---------- tables ---------- */
  .tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);
    background:var(--panel)}
  table{border-collapse:collapse;width:100%;font-size:13.5px}
  th,td{text-align:left;padding:10px 13px;border-bottom:1px solid var(--line-soft);
    vertical-align:middle}
  th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
    font-weight:600;background:var(--panel-2);border-bottom:1px solid var(--line);
    white-space:nowrap}
  tbody tr:last-child td{border-bottom:0}
  tbody tr.clickable{cursor:pointer}
  tbody tr.clickable:hover{background:var(--panel-2)}
  td.num{font-variant-numeric:tabular-nums;white-space:nowrap}

  /* ---------- steps ---------- */
  .step{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px;display:grid;grid-template-columns:30px minmax(0,1fr);gap:14px}
  .step+.step{margin-top:12px}
  .step .n{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);
    color:var(--accent);border:1px solid var(--accent-line);display:grid;
    place-items:center;font-size:12.5px;font-weight:700}
  .step.done .n{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}
  .step h4{margin:2px 0 4px;font-size:15px;letter-spacing:-.01em}
  .step .hint{margin:0 0 12px;font-size:13px;color:var(--muted);max-width:62ch}

  .howto{margin-top:12px;border-top:1px solid var(--line-soft);padding-top:11px}
  .howto summary{cursor:pointer;font-size:12.5px;color:var(--accent);
    list-style:none;display:inline-flex;align-items:center;gap:5px}
  .howto summary::-webkit-details-marker{display:none}
  .howto summary::before{content:"?";width:15px;height:15px;border-radius:50%;
    background:var(--accent-soft);border:1px solid var(--accent-line);
    display:grid;place-items:center;font-size:10px;font-weight:700}
  .howto ol{margin:9px 0 0;padding-left:20px;font-size:13px;color:var(--muted)}
  .howto li+li{margin-top:3px}

  /* ---------- creative ---------- */
  .shot{border:1px solid var(--line);border-radius:9px;overflow:hidden;
    background:var(--bg)}
  .shot img{display:block;width:100%;height:180px;object-fit:cover;background:var(--panel-2)}
  .shot .meta{padding:8px 10px;font-size:12px;color:var(--muted);
    display:flex;justify-content:space-between;gap:8px;align-items:center}
  .pick{position:relative;cursor:pointer}
  .pick input{position:absolute;opacity:0;pointer-events:none}
  .pick.sel{outline:2px solid var(--accent);outline-offset:1px}
  .pick.sel .meta{background:var(--accent-soft);color:var(--accent)}
  .pick .tick{position:absolute;top:8px;right:8px;width:22px;height:22px;
    border-radius:50%;background:var(--accent);color:#fff;display:none;
    place-items:center;font-size:12px;font-weight:700}
  .pick.sel .tick{display:grid}
  .dl{display:inline-flex;align-items:center;gap:7px;margin-top:12px;
    background:var(--accent);color:#fff;border:0;border-radius:8px;
    padding:9px 15px;font-size:14px;font-weight:500;text-decoration:none}
  .dl:hover{filter:brightness(1.06)}

  /* ---------- result ---------- */
  .verdict{display:flex;gap:14px;align-items:flex-start}
  .verdict .icon{width:38px;height:38px;border-radius:50%;flex:none;
    display:grid;place-items:center;font-size:19px;font-weight:700}
  .v-ok .icon{background:var(--ok-soft);color:var(--ok)}
  .v-bad .icon{background:var(--bad-soft);color:var(--bad)}
  .v-wait .icon{background:var(--warn-soft);color:var(--warn)}
  .verdict h2{margin:0;font-size:17px;letter-spacing:-.01em}
  .v-ok h2{color:var(--ok)} .v-bad h2{color:var(--bad)} .v-wait h2{color:var(--warn)}
  .verdict p{margin:5px 0 0;color:var(--muted);font-size:13.5px;max-width:62ch}

  dl{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;margin:16px 0 0;
    padding-top:14px;border-top:1px solid var(--line-soft);font-size:13px}
  dt{color:var(--faint)} dd{margin:0;word-break:break-word}
  dd a{color:var(--accent)}

  .checks{display:flex;flex-direction:column;gap:7px;margin-top:14px}
  .chk{display:flex;gap:9px;align-items:flex-start;font-size:13.5px}
  .chk b{width:17px;flex:none;text-align:center;font-weight:700}
  .chk.pass b{color:var(--ok)} .chk.fail b{color:var(--bad)}
  .chk.skip b{color:var(--faint)} .chk.skip{color:var(--faint)}

  .bar{height:6px;border-radius:99px;background:var(--line-soft);overflow:hidden;
    margin-top:10px}
  .bar i{display:block;height:100%;border-radius:99px;background:var(--accent);
    transition:width .3s}

  .empty{text-align:center;padding:40px 20px;color:var(--faint);font-size:14px}
  .toast{position:fixed;right:18px;bottom:18px;z-index:50;max-width:360px;
    background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);
    border-radius:9px;padding:12px 14px;font-size:13.5px;
    box-shadow:0 8px 24px rgba(0,0,0,.13)}
  .toast.bad{border-left-color:var(--bad)}
  .toast.ok{border-left-color:var(--ok)}
  .toast b{display:block;margin-bottom:2px}

  .drawer{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.4);
    display:flex;justify-content:flex-end}
  .drawer .panel{width:min(560px,100%);background:var(--bg);overflow-y:auto;
    padding:22px;border-left:1px solid var(--line)}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand"><i></i> Campaign Portal</div>
    <div class="who">
      <label for="uid">Signed in as</label>
      <input id="uid" type="text" placeholder="ravi" autocomplete="off">
      <label for="atok" style="margin-left:6px">Admin token</label>
      <input id="atok" type="text" placeholder="optional" autocomplete="off">
    </div>
  </div>
</header>

<div class="shell">
  <aside class="rail">
    <h3>Participate</h3>
    <nav>
      <a data-go="campaigns">Campaigns</a>
      <a data-go="mine">My submissions</a>
    </nav>
    <h3>Administration</h3>
    <nav>
      <a data-go="manage">Manage campaigns</a>
      <a data-go="review">Review submissions</a>
    </nav>
  </aside>
  <main id="main"></main>
</div>

<div id="toasts"></div>
<div id="drawer"></div>

<script>
const $ = s => document.querySelector(s);
const ES = {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"};
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ES[c]);

// ---------- identity ----------
// There is no authentication yet, so identity is entered here and sent as a
// header. When real auth arrives, only this block and the api() headers change.
const store = {
  get user() { try { return localStorage.getItem("cp_user") || "ravi"; } catch { return "ravi"; } },
  set user(v) { try { localStorage.setItem("cp_user", v); } catch {} },
  get admin() { try { return localStorage.getItem("cp_admin") || ""; } catch { return ""; } },
  set admin(v) { try { localStorage.setItem("cp_admin", v); } catch {} },
};
$("#uid").value = store.user;
$("#atok").value = store.admin;
$("#uid").addEventListener("change", e => { store.user = e.target.value.trim() || "ravi"; render(); });
$("#atok").addEventListener("change", e => { store.admin = e.target.value.trim(); });

// ---------- API ----------
async function api(path, {method = "GET", body, form, admin = false} = {}) {
  const headers = {"X-User-Id": store.user};
  if (admin && store.admin) headers["X-Admin-Token"] = store.admin;
  let payload;
  if (form) payload = form;
  else if (body) { headers["content-type"] = "application/json"; payload = JSON.stringify(body); }

  const r = await fetch(path, {method, headers, body: payload});
  const text = await r.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { data = null; }

  if (!r.ok) {
    // Every error arrives in one shape: {"error", "message"}
    const err = new Error((data && data.message) || `HTTP ${r.status}`);
    err.code = data && data.error;
    throw err;
  }
  return data;
}

function toast(message, kind = "") {
  const el = document.createElement("div");
  el.className = "toast " + kind;
  const heading = kind === "bad" ? "Could not do that"
    : kind === "ok" ? "Done" : "Note";
  // textContent, never innerHTML: this text can come from the server, and the
  // page's content policy is only safe while nothing untrusted becomes markup.
  const b = document.createElement("b");
  b.textContent = heading;
  el.append(b, document.createTextNode(message));
  $("#toasts").append(el);
  setTimeout(() => el.remove(), 5200);
}

// ---------- small helpers ----------
const pill = (status) => `<span class="pill p-${esc(status)}"><i></i>${esc(status)}</span>`;
const when = (iso) => iso ? new Date(iso).toLocaleString(undefined,
  {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"}) : "—";
const REASON_LABEL = {
  too_old: "Posted outside the window",
  image_mismatch: "Image did not match",
  wrong_platform: "Wrong platform selected",
  duplicate: "Already submitted",
  post_not_found: "Post could not be opened",
  no_image_in_post: "No image in the post",
  unsupported_url: "Link not supported",
  campaign_closed: "Campaign closed",
  manual_reject: "Rejected in review",
  engine_unavailable: "Verification service down",
  time_not_available: "Post time unavailable",
  no_campaign_assets: "Campaign has no image",
};

// ---------- routing ----------
let route = {view: "campaigns", id: null};
const timers = new Set();
function clearTimers() { timers.forEach(clearTimeout); timers.clear(); }
function later(fn, ms) { const t = setTimeout(fn, ms); timers.add(t); return t; }

function go(view, id = null) {
  route = {view, id};
  location.hash = id ? `${view}/${id}` : view;
  render();
}
addEventListener("hashchange", () => {
  const [view, id] = location.hash.slice(1).split("/");
  if (view && (view !== route.view || id != route.id)) {
    route = {view, id: id || null};
    render();
  }
});
document.querySelectorAll("[data-go]").forEach(a =>
  a.addEventListener("click", () => go(a.dataset.go)));

function markRail() {
  document.querySelectorAll(".rail a").forEach(a =>
    a.classList.toggle("on", a.dataset.go === route.view
      || (route.view === "campaign" && a.dataset.go === "campaigns")
      || (route.view === "submission" && a.dataset.go === "mine")));
}

async function render() {
  clearTimers();
  markRail();
  const main = $("#main");
  main.innerHTML = `<p class="muted">Loading…</p>`;
  // Using `??` here was a bug: the view runs but returns undefined, and
  // `undefined ?? notFound()` then wipes out what it just rendered.
  const view = VIEWS[route.view];
  if (!view) { notFound(main); return; }
  try {
    await view(main, route.id);
  } catch (e) {
    main.innerHTML = `<div class="card"><h1>Something went wrong</h1>
      <p class="sub">${esc(e.message)}</p>
      <button class="btn-2" onclick="location.reload()">Try again</button></div>`;
  }
}
const notFound = m => { m.innerHTML = `<div class="empty">This page does not exist</div>`; };

// ---------- VIEW: campaigns (participant) ----------
const VIEWS = {};

VIEWS.campaigns = async (main) => {
  const rows = await api("/v1/campaigns?status=active");
  const mine = await api("/v1/enrollments");
  const joined = new Map(mine.map(e => [e.campaign_id, e]));

  main.innerHTML = `
    <h1>Campaigns</h1>
    <p class="sub">Open the campaign you want to join, download its image, post it
      to your own social media account — then paste the link to that post here.</p>
    ${rows.length ? `<div class="grid g2">${rows.map(c => {
      const e = joined.get(c.id);
      return `<div class="card">
        <div class="spread">
          <b>${esc(c.title)}</b>
          ${e ? pill(e.status === "completed" ? "completed" : "active") : ""}
        </div>
        <p class="small muted" style="margin:7px 0 0">
          ${esc(c.description || "Posting window: " + c.window_hours + " hours")}</p>
        <div class="row" style="margin-top:14px">
          <button class="btn btn-sm" data-open="${c.id}">
            ${e ? "Open" : "Join"}</button>
          <span class="faint small">${c.window_hours}-hour window</span>
        </div>
      </div>`;
    }).join("")}</div>` : `<div class="empty">No campaign is running yet.<br>
      <span class="small">Create one under Administration &rarr; Manage campaigns.</span></div>`}`;

  main.querySelectorAll("[data-open]").forEach(b =>
    b.addEventListener("click", async () => {
      const id = Number(b.dataset.open);
      try {
        await api(`/v1/campaigns/${id}/enroll`, {method: "POST"});
        go("campaign", id);
      } catch (e) { toast(e.message, "bad"); }
    }));
};

// ---------- VIEW: one campaign (participant) ----------
VIEWS.campaign = async (main, id) => {
  const campaign = await api(`/v1/campaigns/${id}`);
  const enrollments = await api("/v1/enrollments");
  const enrollment = enrollments.find(e => e.campaign_id === Number(id));
  const subs = await api(`/v1/submissions?campaign_id=${id}`);
  const live = subs.find(s => s.status === "pending" || s.status === "verifying");

  const many = campaign.assets.length > 1;

  main.innerHTML = `
    <button class="link" data-back>&larr; all campaigns</button>
    <h1 style="margin-top:10px">${esc(campaign.title)}</h1>
    <p class="sub">Three steps: download the image, post it to your own account,
      then paste the link to that post here.</p>

    <div class="step">
      <div class="n">1</div>
      <div>
        <h4>Download the image</h4>
        <p class="hint">${many
          ? "Choose the image you want to post, then download it."
          : "This is the image to post."}</p>
        <div class="grid g3" id="assets">
          ${campaign.assets.map((a, i) => `
            <div class="shot pick ${i === 0 ? "sel" : ""}" data-asset="${a.id}"
                 data-name="${esc(a.filename)}">
              <span class="tick">&#10003;</span>
              <img src="/v1/campaigns/${campaign.id}/assets/${a.id}/file" alt="">
              <span class="meta"><span>${esc(a.filename)}</span>
                <span class="faint">${Math.round(a.size_bytes / 1024)} KB</span></span>
            </div>`).join("")}
        </div>
        <a class="dl" id="dl" href="#" download>&#8595;&nbsp; Download image</a>
      </div>
    </div>

    <div class="step">
      <div class="n">2</div>
      <div>
        <h4>Post it to your account</h4>
        <p class="hint">Post the downloaded image to your own social media account.
          Two things matter — the <b>post must be public</b> (we cannot open a
          private post), and it must be published <b>within
          ${campaign.window_hours} hours</b>.</p>
      </div>
    </div>

    <div class="step">
      <div class="n">3</div>
      <div>
        <h4>Paste the link to that post here</h4>
        <p class="hint">${live
          ? "One of your submissions is being checked — you can send another once that result is in."
          : "We need the full URL of the post, not of your profile."}</p>
        <div class="field">
          <label class="f" for="plat">Which platform you posted on</label>
          <select id="plat" ${live ? "disabled" : ""}>
            <option value="instagram">Instagram</option>
            <option value="facebook">Facebook</option>
            <option value="x">X (Twitter)</option>
            <option value="linkedin">LinkedIn</option>
            <option value="youtube">YouTube</option>
          </select>
        </div>
        <div class="field">
          <label class="f" for="url">Link to the post</label>
          <input id="url" type="url" placeholder="https://www.instagram.com/p/XXXXXXXX/"
                 ${live ? "disabled" : ""}>
        </div>
        <button class="btn" id="send" style="margin-top:14px" ${live ? "disabled" : ""}>
          Submit</button>

        <details class="howto">
          <summary>How do I find the link to my post?</summary>
          <ol id="howsteps"></ol>
        </details>
      </div>
    </div>

    <div id="live"></div>

    ${subs.length ? `<h3 style="font-size:13px;margin:26px 0 10px" class="faint">
      MY SUBMISSIONS FOR THIS CAMPAIGN</h3>
      ${submissionTable(subs)}` : ""}`;

  // Finding the link differs per platform, so the steps follow the selection.
  const HOWTO = {
    instagram: ["Open your post", "Tap the three dots at the top right",
                "Choose &ldquo;Link&rdquo; or &ldquo;Copy link&rdquo;"],
    facebook: ["Open your post", "Tap the three dots above the post",
               "Choose &ldquo;Copy link&rdquo;"],
    x: ["Open your post", "Tap the share icon below it",
        "Choose &ldquo;Copy link&rdquo;"],
    linkedin: ["Open your post", "Tap the three dots at the top right",
               "Choose &ldquo;Copy link to post&rdquo;"],
    youtube: ["Open your video", "Tap &ldquo;Share&rdquo;",
              "Copy the link"],
  };
  const PLACEHOLDER = {
    instagram: "https://www.instagram.com/p/XXXXXXXX/",
    facebook: "https://www.facebook.com/<page>/posts/1234567890",
    x: "https://x.com/<user>/status/1234567890",
    linkedin: "https://www.linkedin.com/feed/update/urn:li:activity:1234567890/",
    youtube: "https://youtu.be/XXXXXXXXXXX",
  };
  const syncPlatform = () => {
    const p = main.querySelector("#plat").value;
    main.querySelector("#howsteps").innerHTML =
      HOWTO[p].map(x => `<li>${x}</li>`).join("");
    main.querySelector("#url").placeholder = PLACEHOLDER[p];
  };
  main.querySelector("#plat").addEventListener("change", syncPlatform);
  syncPlatform();

  // The download button always points at the selected creative.
  const syncDownload = () => {
    const sel = main.querySelector(".pick.sel");
    const dl = main.querySelector("#dl");
    if (!sel) { dl.style.display = "none"; return; }
    dl.href = `/v1/campaigns/${campaign.id}/assets/${sel.dataset.asset}/file`;
    dl.setAttribute("download", sel.dataset.name);
  };
  syncDownload();

  main.querySelector("[data-back]").addEventListener("click", () => go("campaigns"));
  main.querySelectorAll(".pick").forEach(p => p.addEventListener("click", () => {
    main.querySelectorAll(".pick").forEach(x => x.classList.remove("sel"));
    p.classList.add("sel");
    syncDownload();
  }));

  if (live) watch(live.id, main.querySelector("#live"));

  main.querySelector("#send")?.addEventListener("click", async () => {
    const url = main.querySelector("#url").value.trim();
    if (!url) return toast("Paste the link to your post", "bad");
    const asset = main.querySelector(".pick.sel")?.dataset.asset;
    const btn = main.querySelector("#send");
    btn.disabled = true; btn.textContent = "Sending…";
    try {
      const created = await api("/v1/submissions", {method: "POST", body: {
        enrollment_id: enrollment.id,
        post_url: url,
        platform: main.querySelector("#plat").value,
        asset_id: asset ? Number(asset) : null,
      }});
      main.querySelector("#url").value = "";
      watch(created.id, main.querySelector("#live"));
    } catch (e) {
      toast(e.message, "bad");
    } finally {
      btn.disabled = false; btn.textContent = "Submit";
    }
  });
};

// ---------- live status ----------
async function watch(id, box) {
  const started = Date.now();
  const tick = async () => {
    let d;
    try { d = await api(`/v1/submissions/${id}`); }
    catch (e) { box.innerHTML = `<div class="card"><p class="muted">${esc(e.message)}</p></div>`; return; }

    box.innerHTML = resultCard(d, Date.now() - started);
    if (d.status === "pending" || d.status === "verifying") later(tick, 2000);
    else if (d.status === "approved") toast("Your submission was approved", "ok");
  };
  await tick();
}

function resultCard(d, elapsedMs) {
  const waiting = d.status === "pending" || d.status === "verifying";
  const ok = d.status === "approved";
  const kind = waiting ? "v-wait" : ok ? "v-ok" : "v-bad";
  const icon = waiting ? "…" : ok ? "✓" : "!";
  const seconds = Math.round(elapsedMs / 1000);

  const title = waiting ? "Checking"
    : ok ? "Everything checks out" : (REASON_LABEL[d.reason] || "Rejected");

  return `<div class="card ${kind}" style="margin-top:14px">
    <div class="verdict ${kind}">
      <div class="icon">${icon}</div>
      <div style="min-width:0">
        <h2>${esc(title)}</h2>
        <p>${esc(d.message || (waiting
          ? "Opening the post. Instagram and Facebook take 15-20 seconds."
          : ""))}</p>
      </div>
      <span style="margin-left:auto">${pill(d.status)}</span>
    </div>

    ${waiting ? `<div class="bar"><i style="width:${Math.min(seconds / 20 * 100, 95)}%"></i></div>
      <p class="small faint" style="margin:7px 0 0">${seconds}s</p>`
    : `<div class="checks">
        ${check(d.resolved_platform ? "pass" : "skip",
                d.resolved_platform
                  ? `Platform: ${d.resolved_platform}` + (d.reason === "wrong_platform"
                      ? ` — you selected ${d.declared_platform}` : "")
                  : "Platform not identified",
                d.reason === "wrong_platform" ? "fail" : null)}
        ${check(d.within_window === true ? "pass" : d.within_window === false ? "fail" : "skip",
                d.published_at
                  ? `Posted at ${when(d.published_at)}`
                  : "Post time could not be read")}
        ${check(d.reason === "image_mismatch" ? "fail"
                : d.image_verdict ? "pass" : "skip",
                d.image_verdict
                  ? `Image: ${d.image_verdict} (${d.image_score}% match)`
                  : "Image not checked")}
        ${d.reason === "duplicate"
          ? check("fail", "This post has already been submitted") : ""}
      </div>
      <dl>
        <dt>Post</dt><dd>${d.canonical_url
          ? `<a href="${esc(d.canonical_url)}" target="_blank" rel="noopener">${esc(d.canonical_url)}</a>`
          : esc(d.post_url)}</dd>
        <dt>Submitted</dt><dd>${when(d.created_at)}</dd>
        ${d.verified_at ? `<dt>Checked</dt><dd>${when(d.verified_at)}</dd>` : ""}
        ${d.attempts > 1 ? `<dt>Attempts</dt><dd>${d.attempts}</dd>` : ""}
      </dl>`}
  </div>`;
}

function check(state, text, override) {
  const s = override || state;
  const mark = s === "pass" ? "✓" : s === "fail" ? "✕" : "–";
  return `<div class="chk ${s}"><b>${mark}</b><span>${esc(text)}</span></div>`;
}

// ---------- VIEW: my submissions ----------
VIEWS.mine = async (main) => {
  const rows = await api("/v1/submissions");
  main.innerHTML = `
    <h1>My submissions</h1>
    <p class="sub">Every link you have sent, and how each one turned out.</p>
    ${rows.length ? submissionTable(rows, true) : `<div class="empty">Nothing submitted yet.</div>`}`;
  wireRows(main);
};

function submissionTable(rows, showCampaign = false) {
  return `<div class="tw"><table>
    <thead><tr>
      ${showCampaign ? "<th>Campaign</th>" : ""}
      <th>Post</th><th>Status</th><th>Reason</th><th>When</th>
    </tr></thead>
    <tbody>${rows.map(s => `<tr class="clickable" data-sub="${s.id}">
      ${showCampaign ? `<td class="num">#${s.campaign_id}</td>` : ""}
      <td style="max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
        <span class="mono small">${esc(s.post_url)}</span></td>
      <td>${pill(s.status)}</td>
      <td class="small muted">${esc(REASON_LABEL[s.reason] || (s.reason || "—"))}</td>
      <td class="num small muted">${when(s.created_at)}</td>
    </tr>`).join("")}</tbody></table></div>`;
}

function wireRows(scope) {
  scope.querySelectorAll("[data-sub]").forEach(tr =>
    tr.addEventListener("click", () => go("submission", tr.dataset.sub)));
}

VIEWS.submission = async (main, id) => {
  const d = await api(`/v1/submissions/${id}`);
  main.innerHTML = `<button class="link" data-back>&larr; back</button>
    <h1 style="margin-top:10px">Submission #${d.id}</h1>
    <p class="sub">Campaign #${d.campaign_id}</p>

  main.querySelector("[data-back]").addEventListener("click", () => go("mine"));
  watch(d.id, main.querySelector("#live"));
};

    <button class="link" data-back>&larr; all campaigns</button>

// ---------- VIEW: review submissions (admin) ----------
VIEWS.review = async (main) => {
  const [rows, stats] = await Promise.all([
    api("/v1/admin/submissions?limit=100"),
    api("/v1/admin/stats"),
  ]);
  const by = stats.by_status || {};
  const reasons = stats.by_reject_reason || {};

  main.innerHTML = `
    <h1>Review submissions</h1>
    <p class="sub">Submissions from every participant. Click a row to see the full
      audit trail — the record of every attempt.</p>

    <div class="grid g2" style="margin-bottom:16px">
      <div class="card">
        <label class="f">Status</label>
        <div class="row" style="gap:8px;margin-top:4px">
          ${["approved","rejected","pending","verifying","error"]
            .map(s => `<span class="pill p-${s}"><i></i>${s} ${by[s] || 0}</span>`).join("")}
        </div>
      </div>
      <div class="card">
        <label class="f">Rejection reasons</label>
        <div class="row" style="gap:8px;margin-top:4px">
          ${Object.keys(reasons).length
            ? Object.entries(reasons).map(([r, n]) =>
                `<span class="pill p-rejected"><i></i>${esc(REASON_LABEL[r] || r)} ${n}</span>`).join("")
            : `<span class="faint small">none so far</span>`}
        </div>
      </div>
    </div>

    ${rows.length ? `<div class="tw"><table>
      <thead><tr><th>#</th><th>Campaign</th><th>Post</th><th>Status</th>
        <th>Reason</th><th>Score</th><th>When</th></tr></thead>
      <tbody>${rows.map(s => `<tr class="clickable" data-rev="${s.id}">
        <td class="num">${s.id}</td>
        <td class="num">#${s.campaign_id}</td>
        <td style="max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
          <span class="mono small">${esc(s.post_url)}</span></td>
        <td>${pill(s.status)}</td>
        <td class="small muted">${esc(REASON_LABEL[s.reason] || (s.reason || "—"))}</td>
        <td class="num small">${s.image_score == null ? "—" : s.image_score + "%"}</td>
        <td class="num small muted">${when(s.created_at)}</td>
      </tr>`).join("")}</tbody></table></div>`
    : `<div class="empty">No submissions yet.</div>`}`;

  main.querySelectorAll("[data-rev]").forEach(tr =>
    tr.addEventListener("click", () => openDrawer(tr.dataset.rev)));
};

// ---------- drawer: audit trail ----------
async function openDrawer(id) {
  const box = $("#drawer");
  box.innerHTML = `<div class="drawer"><div class="panel"><p class="muted">Loading…</p></div></div>`;
  box.querySelector(".drawer").addEventListener("click", e => {
    if (e.target.classList.contains("drawer")) box.innerHTML = "";
  });

  let d;
  try { d = await api(`/v1/admin/submissions/${id}`, {admin: true}); }
  catch (e) { box.querySelector(".panel").innerHTML =
    `<p class="muted">${esc(e.message)}</p>`; return; }

  box.querySelector(".panel").innerHTML = `
    <div class="spread">
      <h1 style="margin:0">Submission #${d.id}</h1>
      <button class="btn-2 btn-sm" data-close>Close</button>
    </div>
    <p class="sub" style="margin-top:8px">${pill(d.status)}
      ${d.reason ? `<span class="small muted"> &middot; ${esc(REASON_LABEL[d.reason] || d.reason)}</span>` : ""}</p>

    <div class="card">
      <dl style="margin:0;padding:0;border:0">
        <dt>Post</dt><dd class="mono small">${esc(d.post_url)}</dd>
        <dt>Declared</dt><dd>${esc(d.declared_platform)}</dd>
        <dt>Resolved</dt><dd>${esc(d.resolved_platform || "—")}</dd>
        <dt>Posted at</dt><dd>${when(d.published_at)}</dd>
        <dt>In window</dt><dd>${d.within_window === null ? "—" : d.within_window ? "yes" : "no"}</dd>
        <dt>Image</dt><dd>${d.image_verdict
          ? `${esc(d.image_verdict)} &middot; ${d.image_score}%` : "—"}</dd>
        <dt>Attempts</dt><dd>${d.attempts}</dd>
      </dl>
    </div>

    <div class="card">
      <label class="f">Manual decision</label>
      <div class="field"><input id="note" type="text"
        placeholder="The reason — this goes into the record"></div>
      <div class="row" style="margin-top:11px">
        <button class="btn-ok btn-sm" data-decide="1">Approve</button>
        <button class="btn-bad btn-sm" data-decide="0">Reject</button>
        <button class="btn-2 btn-sm" data-recheck>Check again</button>
      </div>
    </div>

    <label class="f" style="margin-top:20px">Audit trail &middot; ${d.records.length} attempt${d.records.length === 1 ? "" : "s"}</label>
    ${d.records.map(r => `<div class="card" style="margin-top:8px">
      <div class="spread">
        <b class="small">Attempt ${r.attempt}</b>
        <span class="pill p-${esc(r.outcome)}"><i></i>${esc(r.outcome)}</span>
      </div>
      <dl style="margin-top:10px">
        <dt>When</dt><dd>${when(r.checked_at)}</dd>
        ${r.reason ? `<dt>Reason</dt><dd>${esc(REASON_LABEL[r.reason] || r.reason)}</dd>` : ""}
        ${r.image_verdict ? `<dt>Image</dt><dd>${esc(r.image_verdict)} &middot; ${r.image_score}%</dd>` : ""}
        ${r.checked_asset_sha256 ? `<dt>Compared with</dt>
          <dd class="mono small">${esc(r.checked_asset_sha256.slice(0, 16))}…</dd>` : ""}
        <dt>Images tried</dt><dd>${r.assets_tried}</dd>
        ${r.duration_ms ? `<dt>Took</dt><dd>${(r.duration_ms / 1000).toFixed(1)}s</dd>` : ""}
        ${r.error_detail ? `<dt>Detail</dt><dd class="small">${esc(r.error_detail)}</dd>` : ""}
      </dl>
    </div>`).join("")}`;

  const close = () => { box.innerHTML = ""; render(); };
  box.querySelector("[data-close]").addEventListener("click", close);

  box.querySelectorAll("[data-decide]").forEach(b =>
    b.addEventListener("click", async () => {
      const note = box.querySelector("#note").value.trim();
      if (note.length < 3) return toast("Write a reason — it goes into the record", "bad");
      try {
        await api(`/v1/admin/submissions/${id}/decide`, {method: "POST", admin: true,
          body: {approve: b.dataset.decide === "1", note}});
        toast("Decision recorded", "ok");
        close();
      } catch (e) { toast(e.message, "bad"); }
    }));

  box.querySelector("[data-recheck]").addEventListener("click", async () => {
    try {
      await api(`/v1/admin/submissions/${id}/recheck`, {method: "POST", admin: true});
      toast("Put back in the queue", "ok");
      close();
    } catch (e) { toast(e.message, "bad"); }
  });
}
